    <!-- beak -->
    <path d="M80 21 L 122 38 L 80 39 Z" fill="#FECC02"/>
    <!-- red crown -->
    <path d="M56 22 C 59 10, 78 8, 84 18 C 75 20, 64 21, 56 22 Z" fill="#E4002B"/>
  </g>
</svg>
