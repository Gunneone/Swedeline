<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="tile"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="#006AA7"/>
    <!-- neck rising from the bottom edge -->
    <path d="M40 140 C 40 100, 74 92, 66 64 C 61 48, 56 40, 66 30" fill="none" stroke="#FECC02" stroke-width="20" stroke-linecap="round"/>
